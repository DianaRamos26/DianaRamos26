name: Generate Datas

on:
  schedule: # Roda automaticamente a cada 24 horas
    - cron: "0 */24 * * *"
  workflow_dispatch: # Permite que você rode manualmente quando quiser
  push:
    branches:
    - main

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      # Baixa o repositório na máquina virtual
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Gera o jogo da cobrinha usando as suas contribuições
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DianaRamos26
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Salva o arquivo gerado na branch de saída (output)
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
